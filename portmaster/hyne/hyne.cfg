# Hyne port settings. Uncomment a line to change it, then relaunch the port.

# Interface size. The layout targets 640x480 and the default 8 point font
# fits every page, but on a 3.5 inch panel (RG35XX Pro, Plus, H, SP) a
# larger one is easier to read. Anything above 10 makes the widest pages
# scroll sideways. Range 6 to 14.
#HYNE_FONT_SIZE=10

# Qt display backend. Autodetected: linuxfb when /dev/fb0 exists, eglfs
# otherwise. Set it here if the screen stays black, the chosen backend is
# printed at the top of log.txt.
#HYNE_PLATFORM=linuxfb
#HYNE_PLATFORM=eglfs

# Turns the picture when the panel is wired rotated. Only works with the
# eglfs backend. 90, 180 or 270.
#HYNE_ROTATION=90

# Shrinks the whole interface, the opposite trade from HYNE_FONT_SIZE: more
# of the widest pages (Worldmap, Miscellaneous) at once, everything smaller.
#HYNE_SCALE=0.85

# Directory the Open dialog starts in. Autodetected from the usual emulator
# save directories.
#HYNE_SAVEDIR=/userdata/saves/psx
